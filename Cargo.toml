[package]
name = "zterm-r"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Native GTK4 terminal and SSH workspace"
repository = "https://github.com/zhou411X/zterm-r"

[dependencies]
gtk = { package = "gtk4", version = "0.8", features = ["v4_12"] }
vte = { package = "vte4", version = "0.7", features = ["v0_74"] }
glib = "0.19"
gio = "0.19"
libsecret = { version = "0.5", features = ["v0_19"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.10.1"
shell-words = "1.1"
regex = "1"
uuid = { version = "=1.8.0", features = ["v4"] }
libc = "0.2"
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
openssh-sftp-client = "=0.15.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs", "time", "macros"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = "debuginfo"
